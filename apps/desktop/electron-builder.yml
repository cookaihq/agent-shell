# M8d 打包配置。asar:false（用户拍板，贴 open-design）——daemon bundle 可直接 spawn、
# better-sqlite3 .node 可直接加载，绕开 spec §10 标记的两个真包风险。
appId: com.agentshell.app
productName: Agent Shell
electronVersion: 41.7.1
asar: false
# better-sqlite3 的 Electron-ABI .node 已由根 postinstall（scripts/rebuild-better-sqlite3-electron.mjs）
# 统一取好，node_modules 里就是 Electron ABI，故关掉 electron-builder 自带的 rebuild（pnpm 下它的
# electron-rebuild 解析不稳，且此处属重复）。换 Electron 版本时由 postinstall 重新拉对应预编译。
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns     # 应用图标（珍珠立方体 logo）；消除「default Electron icon」警告
  target:
    - dmg
    - zip
  identity: null            # 未签名 / ad-hoc（第一版不签名，右键打开绕 Gatekeeper）
  gatekeeperAssess: false
  hardenedRuntime: false
  notarize: false
win:
  icon: build/icon.ico      # 应用图标（含 256x256，满足 NSIS）
  target:
    - nsis                  # 配置就位，真机出包/装启验收挪 M8f
artifactName: ${productName}-${version}-${arch}.${ext}
# 自动更新 feed（spec §4：挂公开镜像仓 Releases，匿名拉取）。pack 用 --publish never：
# 只把此配置写进包内 app-update.yml，不上传。owner/repo 指向公开镜像仓 cookaihq/agent-shell
# （与 apps/desktop/src/updater.ts 的 RELEASES_PAGE 保持一致）；Releases 未就位前 updater 拉不到 feed 会 fail-soft 不崩。
publish:
  - provider: github
    owner: cookaihq
    repo: agent-shell
