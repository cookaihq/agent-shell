name: Release

# 推送 v* tag 触发：mac/win runner 构建出包 → 上传到 GitHub Release。
# 注：authored 于 M8e，真跑需镜像仓配好（owner/repo + 推 tag）。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pack: pack:mac
          - os: windows-latest
            pack: pack:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本不在此写死：action-setup 读根 package.json 的 packageManager(pnpm@9.12.0)，
      # 与 lockfile/本地开发同源。曾因这里另写 version:10 与 packageManager 冲突，
      # action-setup 报 ERR_PNPM_BAD_PM_VERSION，mac/win 两 job 全挂在此步、release 一直发不出。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 钉 Python 3.11 供 node-gyp 编译原生模块（better-sqlite3）。
      # runner 镜像把默认 Python 升到 3.14，而 distutils 自 3.12 起从标准库移除；
      # better-sqlite3 走的 node-gyp v9.4.1 仍 `from distutils.version import StrictVersion`
      # → postinstall 报 ModuleNotFoundError: No module named 'distutils' → install 整步挂、release 发不出。
      # 3.11 仍自带 distutils，setup-python 会把它前置到 PATH 让 node-gyp 取到。mac/win 两 job 都适用。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Windows 上 better-sqlite3 无预编译二进制，node-gyp 从源码编译（runner 预装 VS Build Tools）。
      # 重试 3 次：electron postinstall 要从 GitHub Releases/CDN 下载二进制，偶发 504 Gateway Time-out
      # 等瞬时网络错误会让整步挂、release 发不出（v0.1.2 首试即因 electron 下载 504 失败）。shell:bash 在
      # mac/win runner 都可用（win 走 git-bash），让重试循环跨平台一致。
      - name: Install deps（重试瞬时网络失败）
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "== pnpm install 尝试 $attempt =="
            pnpm install --frozen-lockfile && exit 0
            echo "install 失败，15s 后重试…"; sleep 15
          done
          echo "pnpm install 连续 3 次失败"; exit 1

      - run: pnpm -C apps/renderer run build

      - run: pnpm run typecheck

      # 不在 release 流水线跑 `pnpm run test`：测试经 vitest-electron(electron-as-node)，
      # GitHub runner 上 electron 二进制装配不稳（"Electron failed to install correctly"），
      # 会无谓阻断打包。对齐 open-design——release 只负责「构建+打包+发布」，测试由上游
      # 开发流程在快照前保证（publish:mirror 前本地 `pnpm run test` 已全绿）。typecheck 作轻量闸门保留。

      - name: Package
        run: pnpm -C apps/desktop run ${{ matrix.pack }}
        env:
          # 第一版未签名：关闭证书自动发现，mac 走 ad-hoc。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.*
          fail_on_unmatched_files: false
